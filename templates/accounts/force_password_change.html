{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="mb-4">Set a New Password</h1>
<p>For security, please set your own password before continuing.</p>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Set password</button>
</form>
{% endblock %}
