{% extends "base.html" %}
{% block content %}
<h1>{{ post.title }}</h1>
<p class="text-muted">
    {% if post.author %}By {{ post.author.get_full_name|default:post.author.email }} &middot; {% endif %}
    {{ post.published_at|date:"F j, Y" }}
</p>

{% if post.featured_image %}
<img src="{{ post.featured_image.url }}" class="img-fluid mb-4" alt="{{ post.title }}">
{% endif %}

<div>{{ post.content|safe }}</div>

<a href="{% url 'blog:list' %}" class="btn btn-link mt-4">&larr; Back to blog</a>
{% endblock %}
