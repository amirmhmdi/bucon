{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="mb-4">{% if object %}Edit{% else %}New{% endif %} Timesheet Entry</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'timesheets:list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
