{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="mb-4">{% if object %}Edit{% else %}New{% endif %} Timesheet Entry</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex justify-content-between">
        <div>
            <button type="submit" name="action" value="save" class="btn btn-primary">Save</button>
            <a href="{% url 'timesheets:list' %}" class="btn btn-link">Cancel</a>
        </div>

        {% if object and object.is_editable %}
            <button type="submit" name="action" value="delete" class="btn btn-danger ms-3"
                    onclick="return confirm('Are you sure you want to delete this timesheet entry?');">
                Delete
            </button>
        {% endif %}
    </div>
</form>
{% endblock %}
